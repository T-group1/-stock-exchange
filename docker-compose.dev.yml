version: '3.8'

services:
  rates_postgres:
    image: mirror.gcr.io/postgres:16-alpine
    container_name: rates_backend_db
    environment:
      POSTGRES_USER: DB_USER
      POSTGRES_PASSWORD: DB_PASSWORD
      POSTGRES_DB: DB_NAME
    ports:
      - "5432:5432"
    volumes:
      - rates_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  rates_pgdata: