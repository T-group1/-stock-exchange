version: 2
sql:
  - engine: postgresql
    schema: "init.sql"
    queries: "sql/queries"
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_interface: true
        overrides:
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "text"
            go_type: "string"
            nullable: false