type: object
properties:
  email:
    description: Email, куда придет алерт
    type: string
    format: email
  currency_pair:
    description: Какую валютную пару отслеживать
    type: string
    example: USD/RUB
  threshold:
    description: Пороговое значение курса для срабатывания алерта
    type: number
    format: float
required:
  - email
  - currency_pair
  - threshold
