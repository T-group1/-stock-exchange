type: object
properties:
  currency_pair:
  type: string
  example: USD_RUB
  description: Валютная пара в формате CODE_CODE (например, USD_RUB)
  pattern: '^[A-Z]{3}_[A-Z]{3}$'
  rate_value:
    type: number
    format: double
  condition:
    type: string
    enum:
      - above
      - below
required:
  - currency_pair
  - rate_value
  - condition
