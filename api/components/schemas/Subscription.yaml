type: object
properties:
  id:
    type: string
    format: uuid
  user_id:
    type: string
    format: uuid
currency_pair:
  type: string
  example: USD_RUB
  description: Валютная пара в формате CODE_CODE (например, USD_RUB)
  rate_value:
    type: number
    format: double
  condition:
    type: string
    enum:
      - above
      - below
  is_active:
    type: boolean
    default: true
  created_at:
    type: string
    format: date-time
  triggered_at:
    description: Время срабатывания уведомления
    type: string
    format: date-time
    nullable: true
required:
  - id
  - user_id
  - currency_pair
  - rate_value
  - condition
  - created_at
