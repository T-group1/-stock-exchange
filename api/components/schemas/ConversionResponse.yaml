type: object
properties:
  from:
    type: string
  to:
    type: string
  amount:
    type: number
    format: double
  result:
    type: number
    format: double
  applied_rate:
    description: Применённый курс
    type: number
    format: double
  date:
    description: Дата, на которую был рассчитан курс (Unix timestamp в секундах)
    type: integer
    format: int64
    example: 1718100000
  calculation_method:
    description: Метод расчёта (прямой курс или через RUB)
    type: string
    enum:
      - direct
      - via_rub
