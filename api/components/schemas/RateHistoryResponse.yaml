type: object
properties:
  pair:
    type: string
  period:
    description: Запрошенный период
    type: string
  data:
    type: array
    items:
      type: object
      properties:
        date:
          description: Дата исторического курса для точки на графике (Unix timestamp в секундах)
          type: integer
          format: int64
          example: 1718100000
        rate:
          type: number
          format: double
