type: object
properties:
  refresh_token:
    description: Токен для обновления access_token
    type: string
    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  expires_in:
    description: Время жизни токена в секундах
    type: integer
    example: 3600
  user:
    $ref: User.yaml
required:
  - refresh_token
  - expires_in
  - user
