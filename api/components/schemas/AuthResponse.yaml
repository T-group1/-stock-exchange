type: object
properties:
  access_token:
    description: JWT токен для доступа к API
    type: string
    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  refresh_token:
    description: Токен для обновления access_token
    type: string
    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  token_type:
    type: string
    example: Bearer
  expires_in:
    description: Время жизни токена в секундах
    type: integer
    example: 3600
  user:
    $ref: User.yaml
required:
  - access_token
  - refresh_token
  - token_type
  - expires_in
  - user
