type: object
properties:
  id:
    type: string
    format: uuid
    readOnly: true
  currency_pair:
    type: string
    example: USD/RUB
  rate_value:
    type: number
    format: float
  updated_at:
    type: string
    format: date-time
    readOnly: true
required:
  - id
  - currency_pair
  - rate_value
  - updated_at
