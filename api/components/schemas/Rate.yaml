type: object
properties:
  pair:
    type: string
    example: USD_RUB
  rate:
    type: number
    format: double
    example: 92.45
  date:
    type: string
    format: date
    example: 2024-01-15
  source:
    description: Источник данных (cb_rf - ЦБ РФ, calculated - расчёт через RUB)
    type: string
    enum:
      - cb_rf
      - calculated
  change_percentage:
    description: Процент изменения курса за сутки
    type: number
    format: double
    example: 1.2
required:
  - pair
  - rate
  - date
  - source