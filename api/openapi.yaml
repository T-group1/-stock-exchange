openapi: 3.0.3
info:
  title: Currency Aggregator API
  version: 0.1.0
  description: API для агрегатора курсов валют и системы уведомлений.
servers:
  - url: http://localhost:8080
    description: local
paths:
  /rates:
    $ref: paths/rates.yaml
  /rates/{pair}:
    $ref: paths/rates_{pair}.yaml
  /subscriptions:
    $ref: paths/subscriptions.yaml
  /subscriptions/{id}:
    $ref: paths/subscriptions_{id}.yaml
components:
  schemas:
    Rate:
      $ref: components/schemas/Rate.yaml
    Subscription:
      $ref: components/schemas/Subscription.yaml
    SubscriptionCreate:
      $ref: components/schemas/SubscriptionCreate.yaml
tags:
  - name: rates
    description: Получение актуальных курсов валют и история изменений.
  - name: subscriptions
    description: Управление подписками на уведомления о курсах (Alert Service).
