get:
  operationId: listSubscriptions
  summary: Получить список всех активных подписок на уведомления
  responses:
    "200":
      description: Список подписок
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Subscription.yaml
post:
  operationId: createSubscription
  summary: Создать подписку на уведомление о курсе
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SubscriptionCreate.yaml
  responses:
    "201":
      description: Подписка успешно создана
