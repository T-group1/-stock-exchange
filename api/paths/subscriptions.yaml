get:
  operationId: listSubscriptions
  summary: Список подписок
  description: Возвращает все активные подписки текущего пользователя
  responses:
    '200':
      description: Список подписок
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Subscription.yaml
    '401':
      $ref: ../components/responses/UnauthorizedError.yaml
  tags:
    - subscriptions
post:
  operationId: createSubscription
  summary: Создать подписку
  description: Создаёт новую подписку на уведомление о курсе
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SubscriptionCreate.yaml
  responses:
    '201':
      description: Подписка создана
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Subscription.yaml
    '400':
      $ref: ../components/responses/ValidationError.yaml
    '401':
      $ref: ../components/responses/UnauthorizedError.yaml
  tags:
    - subscriptions
