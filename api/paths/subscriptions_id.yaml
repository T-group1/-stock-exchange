delete:
  operationId: deleteSubscription
  summary: Удалить подписку
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: Подписка удалена
    '401':
      $ref: ../components/responses/UnauthorizedError.yaml
    '404':
      description: Подписка не найдена
  tags:
    - subscriptions
