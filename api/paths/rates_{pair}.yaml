get:
  operationId: getRateByPair
  summary: Получить историю курса для конкретной валютной пары
  parameters:
    - name: pair
      in: path
      required: true
      schema:
        type: string
      example: USD_RUB
  responses:
    '200':
      description: Успешный ответ
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Rate.yaml
