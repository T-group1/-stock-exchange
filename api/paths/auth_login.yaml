post:
  operationId: loginUser
  summary: Вход в систему
  description: Аутентификация по email и паролю. При успешном входе JWT токен автоматически устанавливается в защищенные HttpOnly куки.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/LoginRequest.yaml
  responses:
    '200':
      description: Успешный вход. Токен успешно сохранен в куках браузера.
      headers:
        Set-Cookie:
          description: Устанавливает безопасную HttpOnly куку с access_token
          schema:
            type: string
            example: access_token=eyJhbGciOiJIUzI1Ni...; Path=/; HttpOnly; Secure; SameSite=Strict
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthResponse.yaml
    '401':
      description: Неверный email или пароль
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
  security: []
  tags:
    - auth
