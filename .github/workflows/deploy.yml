name: Build Frontend

# Запускать скрипт только при пуше в ветку main
on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Даем Гитхабу права на запись готового образа в хранилище
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Скачиваем актуальный код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Авторизуемся в хранилище GitHub (ghcr.io)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Собираем образ и пушим его
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # Важно: Docker требует, чтобы название было строго маленькими буквами
          tags: ghcr.io/t-group1/frontend:latest
